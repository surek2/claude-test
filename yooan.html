<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엄마, 아빠, 유안이</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #FFF8F0;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 50%, #FFD1A4 100%);
            text-align: center;
            padding: 44px 20px 36px;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.2);
        }

        header h1 {
            font-size: 2.4rem;
            color: white;
            text-shadow: 0 2px 6px rgba(0,0,0,0.15);
            letter-spacing: 3px;
        }

        header p {
            color: rgba(255,255,255,0.88);
            margin-top: 10px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .upload-section {
            max-width: 680px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .drop-zone {
            border: 3px dashed #FFB3BA;
            border-radius: 20px;
            padding: 44px 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 2px 12px rgba(255, 107, 107, 0.08);
        }

        .drop-zone:hover, .drop-zone.dragover {
            background: #FFF0F3;
            border-color: #FF6B6B;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 107, 107, 0.15);
        }

        .drop-zone .icon { font-size: 3.2rem; margin-bottom: 14px; }

        .drop-zone h3 {
            color: #FF6B6B;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .drop-zone p { color: #999; font-size: 0.9rem; }

        .upload-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 28px;
            background: linear-gradient(135deg, #FF9A9E, #FF6B6B);
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }

        .upload-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 107, 107, 0.45);
        }

        #fileInput { display: none; }

        .progress-wrap {
            display: none;
            margin-top: 16px;
        }

        .progress-label {
            font-size: 0.85rem;
            color: #FF9A9E;
            margin-bottom: 6px;
            text-align: center;
        }

        .progress-bar {
            background: #FFE0E3;
            border-radius: 10px;
            overflow: hidden;
            height: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF9A9E, #FF6B6B);
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .gallery-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FF6B6B;
            margin: 36px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #FFD6D9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .count {
            font-size: 0.85rem;
            color: #bbb;
            font-weight: 400;
        }

        /* Recent photos — large */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 220px;
            gap: 14px;
        }

        .recent-grid .photo-card:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }

        .recent-grid .photo-card:nth-child(4) {
            grid-column: span 2;
        }

        /* Older photos — small */
        .older-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .older-grid .photo-card {
            aspect-ratio: 1 / 1;
        }

        /* Common card */
        .photo-card {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            background: #f5f5f5;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
            display: block;
        }

        .photo-card:hover img { transform: scale(1.06); }

        .photo-card .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.55));
            padding: 24px 12px 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .photo-card:hover .overlay { opacity: 1; }

        .photo-card .overlay .date {
            color: rgba(255,255,255,0.9);
            font-size: 0.78rem;
        }

        .photo-card .delete-btn {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.45);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px; height: 28px;
            cursor: pointer;
            font-size: 13px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 2;
        }

        .photo-card .delete-btn:hover { background: rgba(220, 50, 50, 0.75); }
        .photo-card:hover .delete-btn { display: flex; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #ccc;
        }

        .empty-state .icon { font-size: 4.5rem; margin-bottom: 18px; }
        .empty-state p { font-size: 1rem; line-height: 1.7; }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox-img-wrap {
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 18px; right: 22px;
            color: rgba(255,255,255,0.8);
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.2s;
        }

        .lightbox-close:hover { color: white; }

        .lightbox-info {
            color: rgba(255,255,255,0.6);
            margin-top: 14px;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.12);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px; height: 50px;
            font-size: 1.6rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
        #lightboxPrev { left: 16px; }
        #lightboxNext { right: 16px; }

        @media (max-width: 768px) {
            header h1 { font-size: 1.7rem; letter-spacing: 1px; }

            .recent-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 160px;
            }

            .recent-grid .photo-card:nth-child(4) {
                grid-column: span 1;
            }

            .older-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .lightbox-nav { display: none; }
        }

        @media (max-width: 480px) {
            .recent-grid { grid-auto-rows: 130px; }
            .older-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<header>
    <h1>💛 엄마, 아빠, 유안이</h1>
    <p>우리 가족의 소중한 순간들</p>
</header>

<div class="upload-section">
    <div class="drop-zone" id="dropZone">
        <div class="icon">📸</div>
        <h3>사진을 여기에 끌어다 놓으세요</h3>
        <p>또는 버튼을 클릭해서 사진을 선택하세요 (여러 장 가능)</p>
        <label class="upload-btn" for="fileInput">사진 선택하기</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-label" id="progressLabel">업로드 중...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<div class="gallery-section">
    <div id="recentSection">
        <div class="section-title">
            ✨ 최근 사진
            <span class="count" id="recentCount"></span>
        </div>
        <div class="recent-grid" id="recentGrid"></div>
    </div>

    <div id="olderSection" style="display:none">
        <div class="section-title">
            🗂 이전 사진
            <span class="count" id="olderCount"></span>
        </div>
        <div class="older-grid" id="olderGrid"></div>
    </div>

    <div class="empty-state" id="emptyState">
        <div class="icon">🌸</div>
        <p>아직 사진이 없어요.<br>첫 번째 사진을 업로드해보세요!</p>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav" id="lightboxPrev">‹</button>
    <div class="lightbox-img-wrap">
        <img id="lightboxImg" src="" alt="">
    </div>
    <div class="lightbox-info" id="lightboxInfo"></div>
    <button class="lightbox-nav" id="lightboxNext">›</button>
</div>

<script>
    // IndexedDB — supports much larger storage than localStorage
    let db;
    const DB_NAME = 'YooanFamilyPhotos';
    const STORE = 'photos';

    function initDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE)) {
                    d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = e => { db = e.target.result; resolve(); };
            req.onerror = reject;
        });
    }

    function getAllPhotos() {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = () => resolve(req.result.sort((a, b) => b.date - a.date));
            req.onerror = reject;
        });
    }

    function savePhoto(photo) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const req = tx.objectStore(STORE).add(photo);
            req.onsuccess = resolve;
            req.onerror = reject;
        });
    }

    function removePhoto(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const req = tx.objectStore(STORE).delete(id);
            req.onsuccess = resolve;
            req.onerror = reject;
        });
    }

    // Resize + compress before storing
    function processImage(file, maxDim = 1800) {
        return new Promise(resolve => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width >= height) {
                        height = Math.round(height * maxDim / width);
                        width = maxDim;
                    } else {
                        width = Math.round(width * maxDim / height);
                        height = maxDim;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.88));
            };
            img.src = url;
        });
    }

    // Gallery state
    let allPhotos = [];
    let lightboxIndex = 0;

    async function handleFiles(files) {
        const images = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (!images.length) return;

        const wrap = document.getElementById('progressWrap');
        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressLabel');
        wrap.style.display = 'block';

        for (let i = 0; i < images.length; i++) {
            label.textContent = `업로드 중... (${i + 1} / ${images.length})`;
            fill.style.width = ((i / images.length) * 100) + '%';
            const dataUrl = await processImage(images[i]);
            await savePhoto({ name: images[i].name, date: Date.now() - i, dataUrl });
        }

        fill.style.width = '100%';
        label.textContent = '완료!';
        setTimeout(() => {
            wrap.style.display = 'none';
            fill.style.width = '0%';
        }, 700);

        await refreshGallery();
    }

    function formatDate(ts) {
        const d = new Date(ts);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일`;
    }

    function makeCard(photo) {
        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = photo.dataUrl;
        img.alt = photo.name;
        img.loading = 'lazy';

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `<div class="date">${formatDate(photo.date)}</div>`;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.title = '삭제';
        del.innerHTML = '✕';
        del.addEventListener('click', async e => {
            e.stopPropagation();
            if (confirm('이 사진을 삭제할까요?')) {
                await removePhoto(photo.id);
                await refreshGallery();
            }
        });

        card.appendChild(img);
        card.appendChild(overlay);
        card.appendChild(del);

        card.addEventListener('click', () => {
            openLightbox(allPhotos.findIndex(p => p.id === photo.id));
        });

        return card;
    }

    async function refreshGallery() {
        allPhotos = await getAllPhotos();

        const recentGrid = document.getElementById('recentGrid');
        const olderGrid = document.getElementById('olderGrid');
        const emptyState = document.getElementById('emptyState');
        const olderSection = document.getElementById('olderSection');

        recentGrid.innerHTML = '';
        olderGrid.innerHTML = '';

        if (!allPhotos.length) {
            emptyState.style.display = 'block';
            olderSection.style.display = 'none';
            return;
        }

        emptyState.style.display = 'none';

        const recent = allPhotos.slice(0, 10);
        const older  = allPhotos.slice(10);

        document.getElementById('recentCount').textContent = `${recent.length}장`;
        recent.forEach(p => recentGrid.appendChild(makeCard(p)));

        if (older.length) {
            olderSection.style.display = 'block';
            document.getElementById('olderCount').textContent = `${older.length}장`;
            older.forEach(p => olderGrid.appendChild(makeCard(p)));
        } else {
            olderSection.style.display = 'none';
        }
    }

    // Lightbox
    function openLightbox(index) {
        lightboxIndex = index;
        updateLightbox();
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function updateLightbox() {
        const p = allPhotos[lightboxIndex];
        document.getElementById('lightboxImg').src = p.dataUrl;
        document.getElementById('lightboxInfo').textContent =
            `${formatDate(p.date)}  ·  ${lightboxIndex + 1} / ${allPhotos.length}`;
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }

    // Touch swipe for mobile
    let touchStartX = 0;
    document.getElementById('lightbox').addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    });
    document.getElementById('lightbox').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) < 40) return;
        if (dx < 0) lightboxIndex = (lightboxIndex + 1) % allPhotos.length;
        else        lightboxIndex = (lightboxIndex - 1 + allPhotos.length) % allPhotos.length;
        updateLightbox();
    });

    // Event wiring
    document.getElementById('fileInput').addEventListener('change', e => {
        handleFiles(e.target.files);
        e.target.value = '';
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', () => {
        lightboxIndex = (lightboxIndex - 1 + allPhotos.length) % allPhotos.length;
        updateLightbox();
    });
    document.getElementById('lightboxNext').addEventListener('click', () => {
        lightboxIndex = (lightboxIndex + 1) % allPhotos.length;
        updateLightbox();
    });
    document.getElementById('lightbox').addEventListener('click', e => {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
    });
    document.addEventListener('keydown', e => {
        if (!document.getElementById('lightbox').classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') {
            lightboxIndex = (lightboxIndex - 1 + allPhotos.length) % allPhotos.length;
            updateLightbox();
        }
        if (e.key === 'ArrowRight') {
            lightboxIndex = (lightboxIndex + 1) % allPhotos.length;
            updateLightbox();
        }
    });

    initDB().then(refreshGallery);
</script>
</body>
</html>
